# run_experiment_recycle_v8_relabel: experiment 8, the relabel probe run, paired to experiment 8's own M0 run of the same
# model and seed: same seed, seat_mode, memory level and opponents, first 100 hands, temperature 0.2.
# The prompt renames the action vocabulary; the game, seats and scoring reference are unchanged.
# Experiment 8 differs from its experiment 7 counterpart in these resolved keys and no others: temperature (0.0 to 0.2),
# action_top_logprobs (absent to the per-model value filled by scripts/collection_job.py, null until set) and, where noted,
# exact_policy.enabled. Prompt set 7 is unchanged. Out root and pilot directory differ because they are placeholders.
# One job is one seed of one model on one H200. Placeholders filled by scripts/collection_job.py:
#   __MODEL_ID__ __REVISION__ __PORT__ __SEED__ __N_HANDS__ __N_SEEDS__ __OUT_ROOT__ __PILOT_DIR__ __ACTION_TOP_LOGPROBS__ __EXACT_POLICY_ENABLED__
#   __GAMES__ is the games for which the prompt-variant registry holds a relabel variant.
# The run includes Dark Hex on the existing 2x2 board.
# The exact-policy pass is on, collected with the run so no post-hoc pass is needed. Its label check is live on relabel: over the
# experiment 7 relabel i0 pieces of all three models, removing a label as a whole word from the
# logged prompt makes the pass refuse (registered reason prompt_vocabulary_unparseable) on every label of every key for Kuhn (20 of 20), Dark Hex (18 of 18), Leduc (421 of 421)
# and Liar's Dice (577 of 577), and on three of Goofspiel's four words (two, three, four: 20 of 32 Qwen, 36 of 44 OLMo, 20 of 32 Mistral).
# The Goofspiel variant mixes notations (bid cards relabelled, prize values and scores left as digits), and that fails loud: the candidates are exactly
# the variant's action_labels, so a digit answer puts mass outside the candidate set and the coverage_mass floor reports it instead of scoring it.
# Residual: one is vacuous, because removing it as a whole word still passes on every Goofspiel key (one is a substring of opponent, which is in every
# prompt's rules text); it matters only if a renderer change dropped one from the options.
# scripts/collection_job.py refuses to plan or render this kind if this flag is not true (requires_exact_pass), so the flag cannot drift off silently.
# Shared with experiment 7 on purpose: the reference caches (cfr_cache_dir, rl_cache_dir) and, where the kind uses them, the off-path sweep table and drive openings, configs/p6_sentinel and the anchor files.
models:
  - id: __MODEL_ID__
    vllm_base_url: http://localhost:__PORT__/v1
    enabled: true
    pilot_dir: __PILOT_DIR__
    served_weights_revision: __REVISION__

games: __GAMES__
opponents: [cfr_ref, bayesian, rl, always_bet]
probe:
  type: relabel
agent0: lm
elicitation_mode: sibling
max_retries: 3
temperature: 0.2
action_top_logprobs: __ACTION_TOP_LOGPROBS__
n_hands: __N_HANDS__
n_seeds: __N_SEEDS__
seed: __SEED__
seat_mode: alternate
memory_rung: __MEMORY_RUNG__
memory_window_k: 5
max_workers: 32
request_timeout_s: 900
belief_protocol: free
runner: local-pool
backend: katana-vllm
serving:
  provider: pbs-injob
  serving_env:
    vllm: "0.31.0"
    torch: "2.13.0"
    python: "3.13"
exact_policy:
  enabled: __EXACT_POLICY_ENABLED__
out_root: __OUT_ROOT__
cfr_iters: 1000
rl_iterations: 1000
cfr_cache_dir: data/cfr_policies
rl_cache_dir: data/rl_policies
require_cache_hit: true                # the sweep's parent process fails on a cold reference cache instead of solving
wandb:
  enabled: false
  project: lmopt
  mode: online
